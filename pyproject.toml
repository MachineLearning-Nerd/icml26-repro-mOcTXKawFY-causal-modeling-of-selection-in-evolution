[project]
name = "evo-selection-repro"
version = "0.1.0"
description = "Reproduction of Causal Modeling of Selection in Evolution (arXiv 2606.05689)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "causal-learn>=0.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
